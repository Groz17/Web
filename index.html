<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="database.js"></script>
    <title>Booking Hub</title>
</head>
<body>
    <header>
        <h1>Welcome to Booking Hub</h1>
    </header>
    <main>
        <div id="login">
            <form id="form">
                <label for="name">Nome utente:</label>
                <input type="text" id="name" name="name" placeholder="Nome Utente" required>

                <label for="password" aria-placeholder="Password">Password:</label>
                <input type="password" id="psw" name="psw" placeholder="Password" required>

                <button id="accedi" type="submit" onclick="accedi()">Accedi</button>
            </form>

            <p id="psw_dimenticata">Password dimenticata?</p>
        </section>
    </main>
</body>

<script>
    async function accedi(event) {
        event.preventDefault(); // Previene il comportamento predefinito del form
        const username = document.getElementById("name").value;
        const password = document.getElementById("psw").value;

        try {
            const response = await fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password }),
            });

            const data = await response.json();
            if (data.success) {
                alert(data.message);
            } else {
                alert(data.message);
            }
        } catch (error) {
            console.error('Errore durante la richiesta:', error);
            alert('Errore del server');
        }
    }
</script>
</html>
